<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sawaari — 3D bike taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--hud:rgba(30,26,22,.88);--hud-solid:#211d19;--ink:#fff6e5;--muted:#c9bda8;--line:rgba(255,246,229,.16);--accent:#ffd23f;--accent-ink:#211d19;--blue:#5ec8ff;--red:#ff5a4f;--green:#46d07a;--page:#16130f;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hud:rgba(30,26,22,.88);--hud-solid:#211d19;--ink:#fff6e5;--muted:#c9bda8;--line:rgba(255,246,229,.16);--page:#16130f;color-scheme:dark}}
:root[data-theme="dark"]{--hud:rgba(30,26,22,.88);--hud-solid:#211d19;--ink:#fff6e5;--muted:#c9bda8;--line:rgba(255,246,229,.16);--page:#16130f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#game,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none}#fx{pointer-events:none}
.hide{display:none!important}
.pnl{background:var(--hud);border-radius:10px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hz{overflow:hidden}.hz::before{content:"";display:block;height:7px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,#1b1712 9px 18px)}
.ttl{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;color:var(--accent);margin:0;letter-spacing:.5px}
button{font:inherit;color:inherit}
.btn{font-weight:700;font-size:16px;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{font-size:14px;padding:5px 12px}
.btn.big{width:100%;padding:12px;font-size:21px;margin-top:8px;font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.6px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#tl{position:absolute;left:12px;top:12px;width:222px;pointer-events:none}
#tl .in{padding:6px 14px 10px}
#tl .ttl{font-size:27px;line-height:1.15}
#tl .sub{margin:0 0 6px;font-size:13px;color:var(--muted)}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:15px;line-height:1.55;gap:12px}
.stat span{color:var(--muted);white-space:nowrap}.stat b{font-variant-numeric:tabular-nums}
.fuelbar{width:96px;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.fuelbar i{display:block;height:100%;width:100%;background:var(--green)}

#tc{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:stretch;pointer-events:none}
#clockBox{display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:Anton,Impact,sans-serif;font-size:23px;color:var(--accent)}
#compass{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
#cArrow{width:30px;height:30px}
#cDist{font-size:13px;font-weight:700}

#nav{position:absolute;left:50%;top:82px;transform:translateX(-50%);width:min(440px,calc(100% - 540px));min-width:300px;display:flex;gap:10px;align-items:center;padding:6px 12px;background:rgba(20,99,62,.94);border:2px solid rgba(255,255,255,.85);pointer-events:none}
#navIcon{font-size:28px;width:34px;text-align:center;line-height:1}
#nav b{display:block;font-size:17px;line-height:1.15}#nav small{display:block;font-size:13px;opacity:.92;line-height:1.2}

#card{position:absolute;left:12px;top:254px;width:300px;display:none}
#card.show{display:block}
#card .in{padding:5px 14px 10px}
#card h3{margin:4px 0 2px;font-size:15px;font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--accent);letter-spacing:.4px}
#card .who{font-size:17px;font-weight:700;line-height:1.25}
#card p{margin:1px 0;color:var(--muted);font-size:14px;line-height:1.35}
#card p strong{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:6px;align-items:center}
.fare{margin-left:auto;font-size:24px;font-family:Anton,Impact,sans-serif;color:var(--accent)}
.timer{font-family:Anton,Impact,sans-serif;font-size:20px;color:var(--blue)}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:100%;background:var(--blue)}
.kbd{font-size:12px;opacity:.7;font-weight:500}

#tr{position:absolute;right:12px;top:12px;width:176px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
#spd{padding:6px 12px;text-align:right;pointer-events:none}
#spd .big{font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1.05}
#spd .u{font-size:12px;color:var(--muted)}
#spd .ms{font-size:12px;color:var(--muted)}#spd .ms b{color:var(--accent);font-family:Anton,Impact,sans-serif;font-weight:400;font-size:17px}
#mini{display:block;width:176px;height:176px;border-radius:50%;border:5px solid #1b1712;box-shadow:0 6px 18px rgba(0,0,0,.35);background:#2b2620}
#gmaps{display:block;text-align:center;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;padding:4px 6px}
#radio{display:flex;align-items:stretch;overflow:hidden}
#radio>button{background:none;border:0;cursor:pointer;padding:6px 8px;font-size:14px;color:var(--ink)}
#rName{flex:1;display:flex;gap:6px;align-items:center;text-align:left;min-width:0}
#rName span{min-width:0}
#rName b{display:block;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
#rName small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eq{width:22px;height:18px;flex:none}
#stations{padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--hud-solid)}
#stations button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink)}
#stations button.on{background:var(--accent);color:var(--accent-ink)}
#stations small{display:block;font-size:11px;opacity:.75}

#riderBox{position:absolute;left:12px;bottom:14px;width:150px;pointer-events:none}
#portrait{display:block;width:150px;height:165px;border-radius:10px;border:4px solid #1b1712;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),linear-gradient(180deg,#ffb36b,#e0457b 60%,#5a2a7a)}
#riderName{position:absolute;left:10px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:0 8px;border-radius:6px}
#say{position:absolute;left:100px;top:-10px;background:#fff;color:#211d19;font-weight:800;font-size:15px;padding:3px 10px;border-radius:12px;border:2px solid #211d19;white-space:nowrap;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
#say.on{opacity:1;transform:scale(1)}

#toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--hud-solid);color:var(--ink);border:1.5px solid var(--accent);padding:5px 16px;border-radius:999px;font-weight:700;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:28px;color:var(--accent);background:var(--page);text-align:center;padding:20px}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,6,.5);padding:14px}
.panel{background:var(--hud-solid);border-radius:14px;width:min(880px,100%);box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text;border:1px solid var(--line)}
.panel .in{padding:10px 22px 22px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:48px;line-height:1.05;margin:8px 0 4px;color:var(--accent);letter-spacing:.5px}
.panel h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;margin:14px 0 4px;color:var(--accent);letter-spacing:.4px}
.panel .sub{color:var(--muted);font-size:16px;margin:0 0 10px;line-height:1.35}
.panel ul{margin:0 0 6px;padding-left:20px;font-size:15px;line-height:1.45}
.preview{display:flex;justify-content:center;border-radius:12px;background:linear-gradient(180deg,#ffb36b,#e0457b 60%,#5a2a7a);margin:4px 0 8px}
.preview canvas{width:180px;height:196px}
.bikepv{border-radius:12px;background:linear-gradient(180deg,#cfe3f5,#f1e3c8 72%,#c9a878);margin:6px 0 2px;display:flex;justify-content:center}
.bikepv canvas{width:100%;max-width:380px;height:auto}
.fld{display:block;margin:8px 0;font-weight:700;font-size:15px}
.fld input[type=text]{font:inherit;font-weight:600;width:100%;margin-top:2px;padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.fld input[type=range]{width:100%;accent-color:#ffd23f}
.hint{display:block;color:var(--muted);font-weight:500;font-size:13px}
.row2{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.sw{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{border:3px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stats div{border:1px solid var(--line);border-radius:10px;padding:5px 12px}
.stats small{display:block;color:var(--muted)}.stats b{font-size:22px;font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--accent)}

#touch{display:none}
body.pad #touch{display:block}
body.pad #riderBox{display:none}
body.pad #toast{bottom:176px}
#stick{position:absolute;left:18px;bottom:22px;width:144px;height:144px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(30,26,22,.6));border:2px solid rgba(255,246,229,.28);touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#stick .ar{position:absolute;top:50%;transform:translateY(-50%);color:rgba(255,246,229,.5);font-size:18px}
#stick .ar.l{left:12px}#stick .ar.r{right:12px}#stick .ar.u{left:50%;top:10px;transform:translateX(-50%);font-size:13px}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--accent);border:3px solid #1b1712;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 -5px 0 rgba(0,0,0,.18)}
.tbtn{position:absolute;bottom:22px;background:var(--hud);border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.pedal{border-radius:18px;font-family:Anton,Impact,sans-serif;font-size:17px;letter-spacing:.6px;align-items:flex-end;padding-bottom:10px}
.pedal::before{content:"";position:absolute;left:12px;right:12px;top:12px;bottom:38px;border-radius:9px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 6px,transparent 6px 12px)}
.tbtn.on{background:var(--accent);color:var(--accent-ink);transform:translateY(2px)}
#tGas{right:18px;width:86px;height:132px}
#tBrake{right:114px;width:78px;height:98px}
#tHorn{right:124px;bottom:132px;width:60px;height:60px;border-radius:50%;font-size:22px;flex-direction:column}
.tbtn small{display:block;font-family:Anton,Impact,sans-serif;font-size:9px;letter-spacing:.6px;line-height:1}
.steer{width:92px;height:92px;border-radius:24px;font-size:34px;bottom:24px}
#tLeft{left:16px}#tRight{left:118px}
body.btns #stick{display:none}body:not(.btns) .steer{display:none}
#spd .nbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
#spd .nbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#5ec8ff,#b06cff)}
#spd .nlab{font-family:Anton,Impact,sans-serif;font-size:12px;color:#5ec8ff;letter-spacing:.5px;margin-top:2px}
#tNitro{right:30px;bottom:166px;width:66px;height:66px;border-radius:50%;font-size:24px;color:#5ec8ff;border-color:#5ec8ff;flex-direction:column}
#tNitro.on{background:#5ec8ff;color:#16130f}
body.pad .nlab .kbd{display:none}
#dlg{position:absolute;left:50%;bottom:205px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;max-width:min(520px,calc(100% - 24px));background:#fff;color:#211d19;border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 8px 22px rgba(0,0,0,.35);border:3px solid #211d19;z-index:7;pointer-events:none}
#dlg::after{content:"";position:absolute;left:34px;bottom:-12px;border:9px solid transparent;border-top-color:#211d19;border-bottom:0}
#dlgEmo{font-size:34px;width:48px;height:48px;border-radius:50%;background:#ffd23f;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid #211d19}
#dlg b{display:block;font-size:13px;color:#7a5a00;font-weight:800}
#dlg p{margin:0;font-size:16px;font-weight:700;line-height:1.3}
body.pad #dlg{bottom:236px}
.svcbtn{pointer-events:auto;cursor:pointer;margin-top:5px;width:100%;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font-weight:700;font-size:13px;padding:3px 6px}
.svcbtn.warn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#bSet{pointer-events:auto;cursor:pointer;color:var(--ink);font-weight:800;font-size:14px;padding:6px 10px;text-align:center}
.spot{display:block;text-align:center;padding:6px;border-radius:8px;color:#1db954;font-weight:800;text-decoration:none;font-size:14px}
#dact{position:absolute;right:196px;bottom:22px;display:flex;gap:10px;z-index:3}
#dact .tbtn{position:relative;width:76px;height:76px;border-radius:50%;flex-direction:column;gap:2px;font-size:26px}
#dNitro{color:#5ec8ff;border-color:#5ec8ff}#dNitro.on{background:#5ec8ff;color:#16130f}
body.pad #dact{display:none}
#rc{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 24px));z-index:8}
#rc{background:rgba(30,26,22,.95)}#rc .in{padding:8px 18px 14px}
#rc.pop{animation:rcpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rcpop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.rctop{display:flex;gap:12px;align-items:center;margin-top:4px}#rcEmo{font-size:46px;line-height:1}#rcTitle{font-size:30px;display:block}#rcLine{margin:2px 0 0;font-weight:700;font-size:16px}
.rcstars{display:flex;gap:6px;justify-content:center;margin:8px 0 6px}.rcstars i{font-style:normal;font-size:36px;color:#4a4238}.rcstars i.on{color:#ffd23f;animation:star .45s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 12px rgba(255,210,63,.6)}
@keyframes star{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.rcrow{display:flex;justify-content:space-between;font-size:15px;padding:2px 0;color:var(--muted)}.rcrow b{color:var(--ink)}.rcrow.big{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-family:Anton,Impact,sans-serif;font-size:24px;color:var(--accent)}.rcrow.big b{color:var(--accent)}
@media (max-height:460px){#rc{top:50%;width:min(360px,calc(100% - 340px))}#rcEmo{font-size:30px}#rcTitle{font-size:20px}.rcstars i{font-size:22px}.rcrow{font-size:12px}.rcrow.big{font-size:17px}#rc .btn.big{padding:6px;font-size:15px}}
.nring{isolation:isolate;background:conic-gradient(#5ec8ff calc(var(--n,0)*1%),rgba(255,255,255,.1) 0)!important}
.nring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--hud-solid);z-index:-1}
.nring.on::before{background:#2a6f99}.nring.full{animation:nfull 1.1s ease-in-out infinite}
@keyframes nfull{50%{box-shadow:0 0 18px 4px rgba(94,200,255,.7)}}
#tc button{pointer-events:auto;cursor:pointer;color:var(--ink);font-size:19px;padding:0 13px;border-radius:10px}
#postcard{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(540px,calc(100% - 24px));z-index:6}
#postcard .pc-top{display:flex;gap:12px;align-items:center;margin-top:4px}
#pcIcon{font-size:42px;line-height:1}
#postcard small{color:var(--muted);font-size:13px}
#postcard h3{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:26px;color:var(--accent);letter-spacing:.4px}
#postcard p{margin:8px 0 4px;font-size:15px;line-height:1.5}
body.pad #postcard{bottom:auto;top:64px}
#places{position:absolute;left:12px;top:254px;width:300px;max-height:calc(100% - 276px);overflow:auto;z-index:5}
#places .in{padding:4px 12px 10px}
.pl{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:8px;padding:5px 6px;cursor:pointer;color:var(--ink);text-align:left;font-size:14px}
.pl:hover{background:rgba(255,255,255,.06)}
.pl i{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);flex:none}
.pl.done i{background:var(--green);border-color:var(--green)}
.pl.tgt{background:rgba(255,210,63,.16)}
.pl small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}

@media (pointer:coarse){#riderBox{display:none}}
@media (max-width:900px){
  #tl{width:auto}#tl .sub{display:none}#tl .ttl{font-size:18px}#tl .in{padding:3px 10px 6px}.stat{font-size:12px;line-height:1.35}.fuelbar{width:64px}
  #tr{width:124px;gap:5px}#mini{width:124px;height:124px;border-width:4px}#spd{padding:3px 10px}#spd .big{font-size:22px}#spd .ms{display:none}#gmaps{font-size:10px;padding:2px 4px}
  #radio>button{padding:4px 5px}#eq{display:none}
  #clockBox{font-size:16px;padding:4px 10px}#compass{width:62px}#cArrow{width:22px;height:22px}#cDist{font-size:11px}
  #nav{top:60px;width:calc(100% - 330px);min-width:0;padding:4px 10px}#nav b{font-size:14px}#nav small{font-size:11px}#navIcon{font-size:22px;width:26px}
  #card{top:146px;width:min(280px,calc(50% - 30px))}#card .in{padding:2px 10px 6px}#card .who{font-size:14px}#card p{font-size:12px}.fare{font-size:18px}.timer{font-size:15px}#card h3{display:none}#card .row{margin-top:2px}
  .pgrid{grid-template-columns:1fr;gap:4px}.panel h1{font-size:36px}
}
@media (max-width:600px){
  #tc{left:12px;transform:none;top:198px;flex-wrap:wrap;max-width:calc(100% - 160px)}#tc>.pnl{min-height:40px}
  #nav{left:12px;right:12px;transform:none;width:auto;top:300px}
  #card{left:12px;right:12px;width:auto;top:354px}
  #stick{width:120px;height:120px;left:12px}#knob{width:54px;height:54px;margin:-27px 0 0 -27px}
  #tGas{right:12px;width:70px;height:112px}#tBrake{right:92px;width:62px;height:84px}#tHorn{right:98px;bottom:116px;width:52px;height:52px}
  .steer{width:76px;height:76px;font-size:28px}#tLeft{left:12px}#tRight{left:98px}
  body.pad #toast{bottom:214px}
  body.pad #dlg{bottom:262px}
  #tNitro{right:16px;bottom:144px;width:56px;height:56px}

  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.05);}
  fl.type=bp?'bandpass':'lowpass';fl.frequency.value=bp||3200;fl.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(fl);fl.connect(g);g.connect(A.sfx);os.start(t);os.stop(t+d+.05);}

function loopNoise(type,f,q,vol){const ac=A.ac,s=ac.createBufferSource();s.buffer=A.noise;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(A.amb);s.start();return g;}
function startAmbience(){if(!A.ac||A.ambOn)return;A.ambOn=1;const ac=A.ac;
  const base=MAPID==='ladakh'?loopNoise('bandpass',480,.7,.1):MAPID==='bangalore'?loopNoise('lowpass',230,.7,.12):loopNoise('lowpass',650,.6,.07);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=MAPID==='kerala'?.13:.07;lg.gain.value=MAPID==='bangalore'?.03:.07;lfo.connect(lg);lg.connect(base.gain);lfo.start();
  A.rainG=loopNoise('highpass',1400,.5,0);
  setInterval(()=>{if(!A.ac||G.state==='pause'||A.ac.state!=='running')return;const t=ac.currentTime,v=(f,d,ty,vo,dl=0,f2=null)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t+dl);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dl+d*.7);g.gain.setValueAtTime(vo,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g);g.connect(A.amb);o.start(t+dl);o.stop(t+dl+d+.05);};
    if(MAPID==='ladakh'&&R()<.04){const f=pick([1320,1568,1760,1980]);v(f,3,'sine',.025);v(f*2.01,2,'sine',.01);}
    if(MAPID==='bangalore'&&R()<.09){const f=pick([392,440,494,523]);v(f,.18,'square',.012);v(f*1.25,.18,'square',.01);if(R()<.5)v(f,.25,'square',.012,.25);}
    if(MAPID==='bangalore'&&R()<.03)v(pick([660,700]),.6,'sawtooth',.006,0,620);
    if(MAPID==='kerala'&&R()<.12){const f=2200+R()*1400;for(let i=0;i<3;i++)v(f,.09,'sine',.018,i*.12,f*1.35);}
    if(MAPID==='kerala'&&R()<.02)v(700,.35,'sawtooth',.008,0,500);
    A.rainG.gain.setTargetAtTime(WX.rain*.2,t,.5);
  },250);}

  const mr=mm.getBoundingClientRect();mm.width=Math.max(1,Math.round(mr.width*FXD));mm.height=Math.max(1,Math.round(mr.height*FXD));
  const pr=pc.getBoundingClientRect();if(pr.width){pc.width=Math.round(pr.width*FXD);pc.height=Math.round(pr.height*FXD);}
  VIG=null;drawPortrait();
}
window.addEventListener('resize',resize);
let last=performance.now(),fAcc=0,fN=0;
function loop(now){
  const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  try{
    if(G.state==='wasted'){G.wT+=raw;if(G.wT>4.6){cv.style.filter=GRADE;store.set('cond',100);start();toast('Your bike was towed and repaired. The day starts over.',4);}}
    if(G.state==='play'){update(dt);fAcc+=raw;fN++;if(fAcc>3){const fps=fN/fAcc;if(SET.quality==='auto'&&fps<40&&QL.dpr>.7){QL.dpr=Math.max(.7,QL.dpr-.2);QL.parts*=.7;QL.saw=1;resize();}fAcc=0;fN=0;}}
    if(riderDirty)rebuildRider();
    syncMeshes(G.state==='pause'?0:dt);updateCamera(dt);updateLighting();
    renderer.render(scene,camera);drawFX();drawMini();updateHUD();updateCompass();engineTick();drawEq();
  }catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
$('mapTag').textContent=MAP.tag;$('gmaps').href=MAP.gmap;document.querySelector('#places .ttl').textContent=MAP.name.toUpperCase()+' PASSPORT';document.title='Sawaari · '+MAP.name+' — 3D bike taxi';
loadFace();applyQuality();buildWorld3D();READY=true;rebuildRider();updateRadio();
G.clock=10*60;camYaw=bike.a+2.4;camPos.set(bike.x-60,30,bike.y-60);
openPanel('menu');drawPortrait();$('loading').classList.add('hide');requestAnimationFrame(loop);
})();
</script>
